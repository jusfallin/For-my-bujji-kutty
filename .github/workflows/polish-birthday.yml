name: Polish birthday animations

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/polish-birthday.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply animation and mobile polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          center = r'''  /* comes to the front for the YES moment — intentionally short and synchronized */
  function centerThanks(opts){
    opts=opts||{};
    var fast=opts.fast===true;
    stopTalking();following=false;
    var cyT=VH*(VW<720?.77:.81),cxT=VW/2;
    var big=VW<720?1.02:1.36;
    var inDur=REDUCED?260:(fast?560:860);
    var hold=REDUCED?1100:(fast?2550:3400);
    var outDur=REDUCED?260:(fast?560:900);
    setMood("sparkle");
    var first;
    if(!visible){
      el.style.display="block";visible=true;
      x=cxT;y=VH+150;scale=big*.72;rot=0;opacity=0;draw();
      var sy0=y,ss0=scale;
      first=tween({duration:inDur,ease:Ease.outBack,onUpdate:function(v,p){
        opacity=clamp(p*1.8,0,1);
        y=lerp(sy0,cyT,clamp(p,0,1));
        scale=lerp(ss0,big,clamp(p,0,1));
      }});
    }else{
      var sx=x,sy=y,ss=scale;
      first=tween({duration:REDUCED?260:(fast?620:940),ease:Ease.ioCubic,onUpdate:function(v,p){
        var e=Ease.ioCubic(p);
        x=lerp(sx,cxT,e);
        y=lerp(sy,cyT,e)-(REDUCED?0:Math.sin(Math.PI*p)*(fast?105:150));
        scale=lerp(ss,big,e)*(1+(REDUCED?0:Math.sin(Math.PI*p)*.06));
        rot=REDUCED?0:Math.sin(Math.PI*p)*(fast?9:12);
      }}).then(function(){rot=0});
    }
    return first.then(function(){
      follow=null;x=cxT;y=cyT;scale=big;
      setMood("happy");say(SAY.thanks);hop(fast?22:30);
      return wait(hold);
    }).then(function(){
      stopTalking();
      return tween({from:1,to:0,duration:outDur,ease:Ease.ioCubic,onUpdate:function(v,p){
        opacity=v;
        y=cyT-(1-p)*(fast?58:80);
        scale=big*(1+(1-p)*(fast?.11:.16));
      }});
    }).then(function(){opacity=0;visible=false;el.style.display="none"});
  }'''

          pattern = r'''  /\* comes to the front of the screen, says thank you, and leaves \*/\n  function centerThanks\(\)\{.*?\n  \}'''
          s, n = re.subn(pattern, center, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('centerThanks pattern not found')

          sayyes = r'''function sayYes(){
  if(yesFired)return Promise.resolve();
  yesFired=true;
  btnYes.classList.remove("beckon");
  btnYes.disabled=true;

  var r=btnYes.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var all=["rect","circle","heart"];
  var mobile=VW<720;

  /* lighter particle load on phones keeps the emotional beat silky */
  Confetti.burst({x:cx,y:cy,count:mobile?70:125,spread:130,startVelocity:18,ticks:190,shapes:all,scalar:1.06});
  setTimeout(function(){Confetti.burst({x:VW*.18,y:VH*.72,count:mobile?42:72,angle:-62,spread:70,startVelocity:20,ticks:205,shapes:all})},150);
  setTimeout(function(){Confetti.burst({x:VW*.82,y:VH*.72,count:mobile?42:72,angle:-118,spread:70,startVelocity:20,ticks:205,shapes:all})},280);
  setTimeout(function(){Confetti.burst({x:cx,y:cy,count:mobile?32:58,spread:360,startVelocity:11,ticks:185,shapes:["heart"],colors:["#DC97A5","#B86F7E","#E8C66A"],scalar:1.2})},410);
  floatHearts(mobile?18:30,{spreadDelay:.35});
  flashGlow(.78,280,420,720);

  /* Cat + "Forever it is." begin on the SAME beat instead of waiting
     for one animation to finish before the other starts. */
  var catShow=Cat.centerThanks({fast:true});

  yesCard.style.display="block";
  yesCard.setAttribute("aria-hidden","false");
  var cardShow=tween({duration:420,ease:Ease.outBack,onUpdate:function(v,p){
    yesCard.style.opacity=String(clamp(p*1.35,0,1));
    yesCard.style.transform="translate3d(-50%,-50%,0) scale("+(.92+p*.08).toFixed(4)+")";
  }})
  .then(function(){return wait(2700)})
  .then(function(){
    return tween({from:1,to:0,duration:560,ease:Ease.ioCubic,onUpdate:function(v){
      yesCard.style.opacity=String(v);
      yesCard.style.transform="translate3d(-50%,-50%,0) scale("+(.97+v*.03).toFixed(4)+")";
    }});
  })
  .then(function(){
    yesCard.style.display="none";
    yesCard.setAttribute("aria-hidden","true");
  });

  return Promise.all([catShow,cardShow]);
}'''
          pattern = r'''function sayYes\(\)\{.*?\n\}'''
          s, n = re.subn(pattern, sayyes, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('sayYes pattern not found')

          s = s.replace('if(VW<720)n=Math.round(n*.6);', 'if(VW<720)n=Math.round(n*.45);')
          s = s.replace('if(VW<720)count=Math.round(count*.6);', 'if(VW<720)count=Math.round(count*.45);')
          s = s.replace('var cap=VW<720?700:1400;', 'var cap=VW<720?480:1200;')

          marker = '''/* ============================================================\n   REDUCED MOTION\n   ============================================================ */'''
          polish = '''/* ============================================================\n   PERFORMANCE + MOBILE POLISH\n   ============================================================\n#cat,#yesCard,.fheart,#glowOverlay,#confetti,#atmos{transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden}\n#cat,#yesCard{contain:layout paint}\n#yesCard{isolation:isolate}\n@media (max-width:719px){\n  body{min-width:320px}\n  .wrap{padding-inline:max(18px,env(safe-area-inset-left)) max(18px,env(safe-area-inset-right))}\n  #yesCard{width:min(92vw,560px);padding:24px 18px 28px;border-radius:22px}\n  #yesCard .script{font-size:clamp(42px,14vw,72px);line-height:1}\n  #yesCard p{font-size:14px;line-height:1.55}\n  #cat{width:124px}\n  .slot-yes{margin-left:-66px}\n  .slot-no{margin-left:66px}\n}\n@media (max-width:380px){\n  .slot-yes{margin-left:-58px}\n  .slot-no{margin-left:58px}\n  .arena .btn{padding-inline:20px;letter-spacing:.16em}\n  #cat{width:116px}\n}\n@media (min-width:720px) and (max-width:899px){\n  .slot-yes{margin-left:-92px}\n  .slot-no{margin-left:92px}\n}\n@media (prefers-reduced-motion:reduce){#cat,#yesCard{transition:none!important}}\n\n'''
          if 'PERFORMANCE + MOBILE POLISH' not in s:
              if marker not in s:
                  raise SystemExit('reduced-motion marker not found')
              s = s.replace(marker, polish + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit polished site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish birthday animations and mobile performance"
          git push
