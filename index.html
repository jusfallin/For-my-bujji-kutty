<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ONLY FOR MY GIRL💛</title>
  <meta name="description" content="A little birthday celebration, made only for my girl.">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#FADED2;overflow:hidden}
    #app{width:100%;height:100%;border:0;display:block}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var source='./index%20(1).html';
  fetch(source,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('Birthday page failed to load');return r.text()})
    .then(function(html){
      html=html.replace(/Bhavanika/g,'ONLY FOR MY GIRL💛');

      /*
       * Canonical six-part navigation.
       * The original page owns all of its internal interactions (gift unwrap,
       * memory reveal, YES/NO sequence, celebration, letters). This layer only
       * controls which of the six main story sections is visible. It never
       * clones, moves, or re-fires an existing button.
       */
      var fx = `
<style id="six-part-navigation">
  html,body{overflow:hidden!important}
  #world{height:100svh!important;overflow:hidden!important}
  #world>.sec,#world>#hero,#world>#deep,#world>#final{
    display:none!important;
    width:100%!important;
    min-height:100svh!important;
    height:100svh!important;
    max-height:100svh!important;
    overflow-y:auto!important;
    overflow-x:hidden!important;
    padding-top:max(28px,env(safe-area-inset-top))!important;
    padding-bottom:max(92px,env(safe-area-inset-bottom))!important;
    scroll-behavior:smooth!important;
  }
  #world>#hero{padding-top:0!important;padding-bottom:0!important}
  #world>.six-active{display:block!important;animation:sixEnter .68s cubic-bezier(.22,.8,.2,1) both}
  @keyframes sixEnter{from{opacity:0;transform:translateY(22px) scale(.988);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
  #six-nav{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));z-index:120;display:flex;justify-content:center;pointer-events:none}
  #six-nav button{pointer-events:auto;min-height:52px;padding:15px 30px;border:0;border-radius:999px;color:#FFF9F6;background:linear-gradient(140deg,#E7A9B4,#DC97A5 48%,#CE8A99);box-shadow:0 18px 38px -16px rgba(220,151,165,.95);font:500 10.5px Inter,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,opacity .25s ease;touch-action:manipulation}
  #six-nav button:hover{transform:translateY(-3px) scale(1.025)}
  #six-nav button:active{transform:scale(.97)}
  #six-nav .six-back{position:absolute;left:16px;bottom:0;color:#96505F;background:rgba(255,249,246,.92);border:1px solid rgba(150,80,95,.24);box-shadow:0 10px 25px -18px rgba(74,39,50,.45)}
  #six-nav .six-next{margin:auto}
  #six-nav .six-next[hidden]{display:none}
  @media(max-width:720px){
    #six-nav button{min-height:50px;padding:14px 25px;font-size:9.5px}
    #six-nav .six-back{left:10px}
  }
  @media(prefers-reduced-motion:reduce){#world>.six-active{animation:none!important}}
</style>
<div id="six-nav" aria-label="Birthday page navigation">
  <button type="button" class="six-back" id="sixBack">← Go Back</button>
  <button type="button" class="six-next" id="sixNext">Continue ♡</button>
</div>
<script>
(function(){
  'use strict';
  function boot(){
    var world=document.getElementById('world');
    if(!world)return;

    var sections=[].slice.call(world.children).filter(function(el){return el.tagName==='SECTION';});
    if(sections.length!==6)return;

    var next=document.getElementById('sixNext');
    var back=document.getElementById('sixBack');
    if(!next||!back)return;

    var current=0;
    var moving=false;

    function giftComplete(){
      /* yesFired is declared by the original page's canonical YES handler. */
      return window.yesFired===true;
    }

    function canAdvance(){
      return current!==2 || giftComplete();
    }

    function render(index,animate){
      index=Math.max(0,Math.min(5,index));
      if(index===current && document.querySelector('#world>.six-active'))return;
      current=index;
      sections.forEach(function(section,i){
        section.classList.toggle('six-active',i===current);
        if(i!==current)section.scrollTop=0;
      });
      next.hidden=(current===5 || (current===2 && !giftComplete()));
      back.hidden=(current===0);
      next.textContent=current===2?'Continue ♡':'Continue ♡';
      window.scrollTo(0,0);
      sections[current].scrollTop=0;
      if(animate){
        sections[current].classList.remove('six-replay');
        void sections[current].offsetWidth;
        sections[current].classList.add('six-replay');
      }
    }

    next.addEventListener('click',function(e){
      e.preventDefault();
      if(moving||!canAdvance())return;
      moving=true;
      render(current+1,true);
      setTimeout(function(){moving=false},720);
    });

    back.addEventListener('click',function(e){
      e.preventDefault();
      if(moving)return;
      moving=true;
      render(current-1,true);
      setTimeout(function(){moving=false},720);
    });

    /* The original gift/YES sequence must finish before the final Continue
       appears. Polling is deliberately tiny and stops once unlocked. */
    var unlockTimer=setInterval(function(){
      if(current===2 && giftComplete()){
        next.hidden=false;
        clearInterval(unlockTimer);
      }
    },250);

    render(0,false);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
<\/script>`;

      html=html.replace(/<\/body>/,fx+'\n</body>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(err){
      document.getElementById('app').innerHTML='<div style="font:16px system-ui;padding:32px;color:#4A2732">Unable to open the birthday page. Please refresh.</div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
