<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ONLY FOR MY GIRL💛</title>
  <meta name="description" content="A little birthday celebration, made only for my girl.">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#FADED2;overflow:hidden}
    #app{width:100%;height:100%;border:0;display:block}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var source='./index%20(1).html';
  fetch(source,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('Birthday page failed to load');return r.text()})
    .then(function(html){
      /* Keep the original page and its original navigation intact. Only change the displayed name. */
      html=html.replace(/Bhavanika/g,'ONLY FOR MY GIRL💛');

      /* Add the interaction layer without moving/removing any original controls. */
      var fx = `
<style id="interactive-fx">
  /* ---------- cinematic section transition ---------- */
  body.fx-transitioning #backdrop{animation:fxBackdrop .72s ease both}
  body.fx-transitioning #atmos{animation:fxAtmos .72s ease both}
  body.fx-transitioning #app{animation:fxPageShift .72s cubic-bezier(.22,.8,.22,1) both}
  @keyframes fxPageShift{0%{opacity:1;transform:scale(1)}38%{opacity:.72;transform:scale(.985) translateY(4px)}100%{opacity:1;transform:scale(1)}}
  @keyframes fxBackdrop{50%{filter:saturate(1.12) brightness(1.035);transform:scale(1.025)}}
  @keyframes fxAtmos{50%{opacity:.72;transform:scale(1.035)}}

  /* ---------- floating ambient hearts/petals ---------- */
  #fx-particles{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
  .fx-particle{position:absolute;bottom:-40px;left:var(--x);font-size:var(--s);opacity:0;filter:blur(var(--b));animation:fxFloat var(--d) linear var(--delay) infinite;will-change:transform,opacity}
  @keyframes fxFloat{0%{transform:translate3d(0,20px,0) rotate(0) scale(.65);opacity:0}12%{opacity:var(--o)}78%{opacity:var(--o)}100%{transform:translate3d(var(--drift),-115vh,0) rotate(var(--rot)) scale(1.1);opacity:0}}

  /* ---------- touch/click love burst ---------- */
  .fx-burst{position:fixed;z-index:180;pointer-events:none;left:0;top:0;width:1px;height:1px}
  .fx-burst i{position:absolute;font-style:normal;font-size:var(--s);animation:fxBurst .82s cubic-bezier(.18,.72,.25,1) forwards;transform:translate(-50%,-50%)}
  @keyframes fxBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1.25)}}

  /* ---------- button interaction ---------- */
  .fx-button{position:relative;overflow:hidden;isolation:isolate;transition:transform .22s ease,box-shadow .22s ease,filter .22s ease!important}
  .fx-button:hover{transform:translateY(-3px) scale(1.025)!important;filter:saturate(1.06)}
  .fx-button:active{transform:translateY(1px) scale(.97)!important}
  .fx-ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.48);transform:scale(0);animation:fxRipple .62s ease-out forwards;z-index:3}
  @keyframes fxRipple{to{transform:scale(4);opacity:0}}

  /* ---------- reveal / breathing for content ---------- */
  .fx-reveal{animation:fxReveal .85s cubic-bezier(.22,.8,.22,1) both}
  @keyframes fxReveal{from{opacity:.15;transform:translateY(18px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
  .fx-breathe{animation:fxBreathe 4.8s ease-in-out infinite}
  @keyframes fxBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* ---------- pointer/touch tilt ---------- */
  [data-fx-tilt]{transform-style:preserve-3d;transition:transform .28s ease,box-shadow .28s ease}
  [data-fx-tilt].fx-tilting{transition:none}

  /* ---------- ambient pointer glow ---------- */
  #fx-glow{position:fixed;z-index:1;pointer-events:none;width:180px;height:180px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.28),rgba(220,151,165,.10) 38%,transparent 72%);mix-blend-mode:soft-light;opacity:0;transition:opacity .35s ease}

  @media (prefers-reduced-motion:reduce){
    .fx-particle,.fx-reveal,.fx-breathe,body.fx-transitioning #app,body.fx-transitioning #backdrop,body.fx-transitioning #atmos{animation:none!important}
  }
</style>
<div id="fx-particles" aria-hidden="true"></div><div id="fx-glow" aria-hidden="true"></div>
<script>
(function(){
  'use strict';
  var reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function ready(fn){
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true});
    else fn();
  }

  ready(function(){
    var original=document.getElementById('btnCelebrate');
    var hero=document.getElementById('heroInner');

    /* Clone the original Continue button instead of moving it. This preserves the
       original DOM position and its original event handler, fixing the stuck navigation. */
    if(original && hero && !document.getElementById('heroContinueFx')){
      var clone=original.cloneNode(true);
      clone.id='heroContinueFx';
      clone.classList.add('fx-button');
      clone.removeAttribute('name');
      clone.setAttribute('aria-label','Continue');
      clone.textContent='Continue ♡';
      hero.appendChild(clone);
      original.classList.add('fx-original-control');
      original.setAttribute('aria-hidden','true');
      original.tabIndex=-1;
      var oldStyle=document.createElement('style');
      oldStyle.textContent='.fx-original-control{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;opacity:0!important;pointer-events:none!important}#heroContinueFx{min-height:56px!important;padding:18px 42px!important;margin-top:26px!important}';
      document.head.appendChild(oldStyle);
      clone.addEventListener('click',function(e){
        e.preventDefault();
        e.stopImmediatePropagation();
        burst(e.clientX || innerWidth/2,e.clientY || innerHeight/2);
        /* Fire the untouched original control. Its own handler remains in its original context. */
        original.click();
      });
    }

    /* Make every existing interactive control feel alive without replacing its behavior. */
    document.querySelectorAll('button,a,[role="button"]').forEach(function(el){
      if(el.id==='heroContinueFx') return;
      el.classList.add('fx-button');
      el.addEventListener('click',function(e){
        burst(e.clientX || innerWidth/2,e.clientY || innerHeight/2);
        document.body.classList.remove('fx-transitioning');
        void document.body.offsetWidth;
        document.body.classList.add('fx-transitioning');
        setTimeout(function(){document.body.classList.remove('fx-transitioning')},760);
      },{passive:true});
    });

    /* Ripple effect for touch/mouse controls. */
    document.addEventListener('pointerdown',function(e){
      var b=e.target && e.target.closest ? e.target.closest('button,a,[role="button"]') : null;
      if(!b || b.id==='heroContinueFx') return;
      var r=b.getBoundingClientRect();
      var s=Math.max(r.width,r.height)*.5;
      var x=e.clientX-r.left-s, y=e.clientY-r.top-s;
      var rip=document.createElement('span'); rip.className='fx-ripple';
      rip.style.width=rip.style.height=(s*2)+'px'; rip.style.left=x+'px'; rip.style.top=y+'px';
      b.appendChild(rip); setTimeout(function(){rip.remove()},700);
    },{passive:true});

    /* Add subtle tilt to image/card-like content. */
    var candidates=document.querySelectorAll('figure,img:not(#loader img),.card,.memory,.photo-card,.letter-card,.wish-card,.polaroid');
    Array.prototype.forEach.call(candidates,function(el){
      if(el.closest && el.closest('#loader')) return;
      if(el.closest && el.closest('button')) return;
      el.setAttribute('data-fx-tilt','');
    });
    document.addEventListener('pointermove',function(e){
      if(reduced || e.pointerType==='touch') return;
      Array.prototype.forEach.call(document.querySelectorAll('[data-fx-tilt]'),function(el){
        var r=el.getBoundingClientRect();
        if(r.width<40 || r.height<40 || r.bottom<0 || r.top>innerHeight) return;
        var dx=(e.clientX-(r.left+r.width/2))/(r.width/2);
        var dy=(e.clientY-(r.top+r.height/2))/(r.height/2);
        if(Math.abs(dx)>1.35 || Math.abs(dy)>1.35) return;
        el.classList.add('fx-tilting');
        el.style.transform='perspective(900px) rotateX('+(-dy*3.2)+'deg) rotateY('+(dx*3.2)+'deg) translateY(-2px)';
      });
    },{passive:true});
    document.addEventListener('pointerleave',function(){
      Array.prototype.forEach.call(document.querySelectorAll('[data-fx-tilt]'),function(el){el.classList.remove('fx-tilting');el.style.transform='';});
    });

    /* Soft cursor glow on desktop; touch gets the tap burst instead. */
    var glow=document.getElementById('fx-glow');
    if(glow && !reduced){
      document.addEventListener('pointermove',function(e){if(e.pointerType!=='touch'){glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';glow.style.opacity='.9'}},{passive:true});
      document.addEventListener('pointerleave',function(){glow.style.opacity='0'});
    }

    /* Give visible content a gentle entrance whenever it becomes visible. */
    if(!reduced && 'IntersectionObserver' in window){
      var io=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('fx-reveal');io.unobserve(entry.target)}})},{threshold:.12});
      document.querySelectorAll('section,.stage,.card,.memory,.letter-card,.wish-card,figure').forEach(function(el){io.observe(el)});
    }

    /* Keep a small, romantic ambient field running across the whole experience. */
    var layer=document.getElementById('fx-particles');
    if(layer && !reduced){
      var chars=['♡','♥','✦','·'];
      for(var i=0;i<18;i++){
        var p=document.createElement('span'); p.className='fx-particle'; p.textContent=chars[i%chars.length];
        p.style.setProperty('--x',(Math.random()*100)+'%');
        p.style.setProperty('--s',(9+Math.random()*16)+'px');
        p.style.setProperty('--d',(9+Math.random()*13)+'s');
        p.style.setProperty('--delay',(-Math.random()*16)+'s');
        p.style.setProperty('--drift',(-70+Math.random()*140)+'px');
        p.style.setProperty('--rot',(-35+Math.random()*70)+'deg');
        p.style.setProperty('--o',(0.16+Math.random()*.3).toFixed(2));
        p.style.setProperty('--b',Math.random()>.7?'1px':'0px');
        layer.appendChild(p);
      }
    }

    /* Tap/click love burst. */
    document.addEventListener('pointerdown',function(e){
      if(e.pointerType==='touch' || e.pointerType==='mouse') burst(e.clientX,e.clientY);
    },{passive:true});

    /* Initial reveal for the opening screen. */
    setTimeout(function(){
      document.querySelectorAll('#heroInner > *').forEach(function(el,i){
        if(!reduced){el.style.animationDelay=(i*70)+'ms';el.classList.add('fx-reveal')}
      });
    },120);
  });

  function burst(x,y){
    if(reduced) return;
    var wrap=document.createElement('div'); wrap.className='fx-burst'; wrap.style.left=x+'px';wrap.style.top=y+'px';
    var chars=['♡','♥','✦','✧','·'];
    for(var i=0;i<7;i++){
      var s=document.createElement('i'); s.textContent=chars[i%chars.length];
      var a=(Math.PI*2*i/7)+(Math.random()-.5)*.45, d=35+Math.random()*65;
      s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
      s.style.setProperty('--r',(-40+Math.random()*80)+'deg');s.style.setProperty('--s',(10+Math.random()*9)+'px');
      s.style.animationDelay=(Math.random()*.08)+'s';wrap.appendChild(s);
    }
    document.body.appendChild(wrap);setTimeout(function(){wrap.remove()},1000);
  }
})();
<\/script>`;
      html=html.replace(/<\/body>/,fx+'\n</body>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(err){
      document.getElementById('app').innerHTML='<div style="font:16px system-ui;padding:32px;color:#4A2732">Unable to open the birthday page. Please refresh.</div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
